                  "halftone", "trame", "ascii", "dither", "pixel", "duotone", "bichromie", "vectoris", "vectorize", "trace",
                  "image trace", "vectorisation", "detour", "détour", "cutout", "remove background", "retouche", "retouch",
                  "photomontage", "montage", "manipulation", "blend", "fusion", "generati", "générer", "génère", "ia ", "ai ",

/* Le logiciel aide aussi : il ajoute un indice à l'analyse */
const APPROCHE_PAR_LOGICIEL = {
  "lightroom": "Capter", "realityscan": "Capter",
  "procreate": "Produire", "fresco": "Produire",
  "after effects": "Déployer", "figma": "Déployer",

/* Tags proposés automatiquement d'après le titre de la vidéo.
   Format :  "tag" : ["mot du titre", "autre mot", ...]   (sans accents ni majuscules nécessaires) */

  "détourage":   ["detour", "detourer", "cutout", "cut out", "remove background", "supprimer l'arriere-plan", "fond"],
  "retouche":    ["retouche", "retoucher", "retouch", "skin", "peau", "portrait"],

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--fg:#fff;--muted:#8a8a8a;--line:#262626;--red:#E63A24;--pad:20px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"Geist",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input{font:inherit;color:inherit}
  .up{font-size:12px;text-transform:uppercase;letter-spacing:.02em}

  /* En-tête : même logo et même hauteur que le site */
  header{position:relative;display:flex;justify-content:center;align-items:center;height:85px;padding:0 var(--pad);border-bottom:1px solid #1a1a1a}
  .sig{position:absolute;left:var(--pad);top:50%;transform:translateY(-50%);color:#BDC9C9;font-size:12px;line-height:14px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;transition:color .15s}
  .sig:hover{color:#fff}
  .sig .inf{display:inline-block;width:1.15em;height:.6em;vertical-align:0;fill:none;stroke:currentColor;stroke-width:1.3}
  .bo{height:52px;display:flex;align-items:center;padding:0 20px;background:#161616;border-radius:3px;color:#BDC9C9}
  .tabs{display:flex;gap:4px;background:#161616;border-radius:3px;padding:4px;height:52px}
  .tabs button{background:none;border:0;border-radius:2px;padding:0 20px;color:#8a8a8a;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  .tabs button:hover{color:#fff}
  .tabs button.on{background:#2a2a2a;color:#fff}
  .hlinks{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);display:flex;gap:24px}
  .hlinks a,.hlinks button{background:none;border:0;color:#8a8a8a;text-decoration:none;cursor:pointer;text-transform:inherit;letter-spacing:inherit;font-size:inherit}
  .hlinks a:hover,.hlinks button:hover{color:var(--fg)}

  main{max-width:1100px;padding:40px var(--pad) 120px}
  h1{font-weight:400;font-size:28px;margin-bottom:28px}
  .demo{border:1px dashed #444;color:#aaa;font-size:12px;padding:10px 14px;margin-bottom:28px}

  /* Formulaire */
  .form{display:grid;grid-template-columns:1fr 160px;gap:28px;border-top:1px solid var(--line);padding-top:24px}
  .fields{display:flex;flex-direction:column;gap:22px;min-width:0}
  .field label{display:block;color:var(--muted);margin-bottom:8px}
  .field input{width:100%;background:none;border:0;border-bottom:1px solid #333;padding:8px 0;font-size:18px;outline:none;transition:border-color .2s}
  .field input:focus{border-color:#fff}
  .field input::placeholder{color:#444}
  .field .help{font-size:12px;color:#666;margin-top:7px;min-height:15px}
  .field .help.ok{color:#7fd17f}
  .field .help.err{color:var(--red)}
  .labels{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .lab{background:none;border:1px solid #333;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.02em;color:#bbb;transition:all .15s}
  .lab:hover{border-color:#666;color:#fff}
  .lab.on{background:var(--red);border-color:var(--red);color:#fff}
  .lab.new{border-style:dashed}
  .labels input{background:none;border:0;border-bottom:1px solid #333;padding:6px 0;font-size:13px;outline:none;width:150px}
  .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .sugg button{background:none;border:0;color:#666;font-size:12px;cursor:pointer;padding:0}
  .sugg button:hover{color:#fff}
  .actions{display:flex;gap:16px;align-items:center}
  .btn{background:var(--red);border:0;color:#fff;padding:11px 20px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .btn:disabled{opacity:.4;cursor:default}
  .ghost{background:none;border:0;color:#8a8a8a;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .ghost:hover{color:#fff}
  .preview{aspect-ratio:9/16;background:#111;border:1px solid #1e1e1e;position:relative;overflow:hidden;align-self:start}
  .preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .preview .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 8px 8px;font-size:11px;line-height:1.3;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
  .field input.fetched{animation:flash 1.2s}
  @keyframes flash{0%{border-color:var(--red)}100%{border-color:#333}}
  .preview span{position:absolute;inset:0;display:grid;place-items:center;color:#444;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:10px}

  /* Galerie */
  .gform{display:flex;flex-direction:column;gap:22px;border-top:1px solid var(--line);padding-top:24px;max-width:900px}
  .drop{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;border:1px dashed #444;border-radius:3px;padding:34px 20px;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:#fff;background:#0d0d0d}
  .drop b{font-weight:400;font-size:15px}
  .drop span{font-size:12px;color:#777;max-width:520px}
  .queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  .qi{display:flex;flex-direction:column;gap:8px;position:relative}
  .qi .th{aspect-ratio:3/4;background:#111;overflow:hidden;position:relative}
  .qi .th img{width:100%;height:100%;object-fit:cover;display:block}
  .qi input{background:none;border:0;border-bottom:1px solid #333;padding:6px 0;font-size:14px;outline:none;width:100%}
  .qi input:focus{border-color:#fff}
  .qi input.bad{border-color:var(--red)}
  .qi .th .pdfph{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:12px;letter-spacing:.04em}
  .qi .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
  .qi input.qs{font-size:12px;color:#aaa;padding:4px 0}
  .qi .qc{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.02em}
  .qi .st{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.02em;min-height:14px}
  .qi .st.ok{color:#7fd17f} .qi .st.err{color:var(--red)} .qi .st.warn{color:#d9b25f}
  .gwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px}
  .gt{display:flex;flex-direction:column;gap:6px;min-width:0}
  .gt .th{aspect-ratio:3/4;background:#111;overflow:hidden}
  .gt .th img{width:100%;height:100%;object-fit:cover;display:block}
  .gt .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gt .ra{display:flex;gap:14px}
  .gt .ra button{background:none;border:0;color:#8a8a8a;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.02em;padding:0}
  .gt .ra button:hover{color:#fff}
  .gt .ra .del:hover,.gt .ra .yes{color:var(--red)}
  .gt.editing .th{outline:1px solid var(--red);outline-offset:3px}
  .list h3{font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:#BDC9C9;margin:26px 0 12px;display:flex;gap:10px}
  .list h3 small{color:#666}

  /* Liste */
  .list{margin-top:72px}
  .list h2{font-weight:400;font-size:22px;margin:40px 0 12px;display:flex;gap:10px;align-items:baseline}
  .list h2 small{font-size:12px;color:var(--muted)}
  .row{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;border-top:1px solid #1a1a1a;padding:12px 0}
  .row.editing{background:#111}
  .plat{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#777}
  .row .t{font-size:15px}
  .row .t.none{color:#555;font-style:italic}
  .row .tg{font-size:12px;color:var(--muted);margin-top:3px}
  .row .lk{font-size:11px;color:#555;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .lk a{color:inherit}
  .row .ra{display:flex;gap:18px}
  .row .ra button{background:none;border:0;color:#8a8a8a;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  .row .ra button:hover{color:#fff}
  .row .ra .del:hover,.row .ra .yes{color:var(--red)}
  .empty{color:#555;font-size:14px;padding:20px 0}

  /* Connexion */
  .login{min-height:70vh;display:grid;place-items:center}
  .login form{width:min(360px,90vw);display:flex;flex-direction:column;gap:18px}
  .login input{background:none;border:0;border-bottom:1px solid #333;padding:10px 0;font-size:18px;outline:none}
  .login input:focus{border-color:#fff}
  .login .err{color:var(--red);font-size:13px;min-height:16px}

  .acces{border:1px solid #262626;padding:16px 18px;margin-bottom:44px;display:flex;flex-direction:column;gap:10px}
  .acces .etat{font-size:14px;color:#ddd}
  .acces .etat b{font-weight:500}
  .acces .etat .ko{color:var(--red)}
  .acces .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .acces input{flex:1;min-width:200px;background:none;border:0;border-bottom:1px solid #333;padding:8px 0;font-size:15px;outline:none}
  .acces input:focus{border-color:#fff}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 16px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--red);color:#fff}
  [hidden]{display:none!important}

  @media (max-width:700px){
    .form{grid-template-columns:1fr}
    .preview{width:160px}
    .row{grid-template-columns:1fr}
    .hlinks{gap:16px}
  }
</style>
</head>
<body>

<header>
  <a class="sig" href="index.html" title="Accueil" aria-label="Lab Experience 360 — accueil">© 2026 — <svg class="inf" viewBox="0 0 16 8.4" aria-label="∞"><circle cx="4.2" cy="4.2" r="3.6"/><circle cx="11.8" cy="4.2" r="3.6"/></svg><br>Lab Experience 360</a>
  <p class="bo up" id="boLbl">Back office</p>
  <div class="tabs up" id="tabs" hidden role="tablist">
    <button type="button" class="on" data-t="tutos" role="tab">Tutos</button>
    <button type="button" data-t="galerie" role="tab">Galerie</button>
  </div>
  <div class="hlinks up">
    <a href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
    <button type="button" id="logout" hidden>Déconnexion</button>
  </div>
</header>

<!-- Connexion -->
<section class="login" id="loginView">
  <form id="loginForm">
    <h1>Back office</h1>
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="btn" type="button" id="loginBtn">Entrer</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<!-- Back office -->
<main id="app" hidden>
  <p class="demo" id="demo" hidden>Mode démo : l'API n'est pas encore branchée, rien n'est enregistré.</p>
  <section class="acces" id="acces">
    <div class="up" style="color:#8a8a8a">Accès étudiants</div>
    <p class="etat" id="accesEtat"></p>
    <div class="row2">
      <input type="text" id="cleEtu" placeholder="Nouveau mot de passe étudiant" autocomplete="off" spellcheck="false">
      <button class="btn" type="button" id="cleBtn">Enregistrer</button>
    </div>
  </section>

  <div id="vTutos">
  <h1 id="formTitle">Ajouter un tuto</h1>

  <form class="form" id="form" autocomplete="off">
    <div class="fields">
      <div class="field">
        <label class="up" for="fLien">Lien</label>
        <input id="fLien" placeholder="Colle le lien YouTube, TikTok ou Instagram" required>
        <p class="help" id="lienHelp"></p>
      </div>
      <div class="field">
        <label class="up" for="fTitre">Titre</label>
        <input id="fTitre" placeholder="Ex. Détourage des cheveux">
      </div>
      <div class="field">
        <label class="up" for="fAuteur">Auteur</label>
        <input id="fAuteur" placeholder="Nom de la chaîne ou du créateur">
      </div>
      <div class="field">
        <label class="up" for="fTags">Tags</label>
        <input id="fTags" placeholder="Séparés par des virgules : effets, 3D, bitmap">
        <div class="sugg" id="tagSugg"></div>
      </div>
      <div class="field">
        <label class="up">Logiciel</label>
        <div class="labels" id="labels"></div>
      </div>
      <div class="field">
        <label class="up">Catégories <span style="text-transform:none;color:#555">(plusieurs possibles)</span></label>
        <div class="labels" id="cats"></div>
      </div>
      <div class="field">
        <label class="up">Approche <span style="text-transform:none;color:#555">(plusieurs possibles — proposée automatiquement)</span></label>
        <div class="labels" id="apps"></div>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="save">Ajouter</button>
        <button class="ghost" type="button" id="cancel" hidden>Annuler</button>
      </div>
    </div>
    <div class="preview" id="preview"><span>Aperçu</span></div>
  </form>

  <div class="list" id="list"></div>
  </div>

  <!-- ===== Galerie des projets ===== -->
  <div id="vGal" hidden>
    <h1 id="gTitle">Déposer des projets</h1>
    <div class="gform">
      <div class="field">
        <label class="up">Classe</label>
        <div class="labels" id="gClasse"></div>
      </div>
      <div class="field">
        <label class="up" for="gSujet">Sujet</label>
        <input type="text" id="gSujet" placeholder="Ex. Affiche typographique" autocomplete="off">
        <div class="sugg" id="gSujets"></div>
      </div>
      <div class="field" id="gEleveField" hidden>
        <label class="up" for="gEleve">Élève</label>
        <input type="text" id="gEleve" placeholder="Ex. Léa Martin → Léa M." autocomplete="off">
      </div>
      <label class="drop" id="gDrop">
        <input type="file" id="gFiles" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,.pdf" multiple hidden>
        <b id="gDropT">Glisse les images ici, ou clique pour les choisir</b>
        <span id="gDropS">Nomme tes fichiers CLASSE_SUJET_Prénom_Nom (ex. G3_DUC_Zoé_Pureur.jpg) : la classe (G3), le sujet (DUC) et l'élève (Zoé P.) se remplissent tout seuls. Images ou PDF (1re page), compressés automatiquement pour le site.</span>
      </label>
      <div class="queue" id="gQueue"></div>
      <div class="actions">
        <button class="btn" type="button" id="gSend" disabled>Envoyer</button>
        <button class="ghost" type="button" id="gCancel" hidden>Annuler</button>
      </div>
    </div>
    <div class="list" id="gList"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* Cover YouTube choisie par le créateur : haute définition d'abord, puis repli.
   YouTube renvoie une petite image grise (120 px) quand une taille n'existe pas : on passe alors à la suivante. */
window.ytCover = function (img, failed) {
  var steps = ["maxresdefault", "sddefault", "hqdefault"];
  var i = +(img.dataset.s || 0);
  if (!failed && img.naturalWidth > 120) return;
  i++;
  if (i >= steps.length) { img.remove(); return; }
  img.dataset.s = i;
  img.src = "https://i.ytimg.com/vi/" + img.dataset.id + "/" + steps[i] + ".jpg";
};
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NAME = { tiktok: "TikTok", youtube: "YouTube", instagram: "Instagram" };

  function parseUrl(url) {
    const u = String(url).trim();
    let m = u.match(/tiktok\.com\/.*\/(?:video|photo)\/(\d+)/i);
    if (m) return { type: "tiktok", id: m[1] };
    m = u.match(/(?:youtube\.com\/(?:shorts\/|watch\?(?:.*&)?v=|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) return { type: "youtube", id: m[1] };
    m = u.match(/instagram\.com\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/i);
    if (m) return { type: "instagram", kind: m[1].toLowerCase() === "reels" ? "reel" : m[1].toLowerCase(), id: m[2] };
    if (/vm\.tiktok\.com|vt\.tiktok\.com/i.test(u)) return { type: "short" };
    return null;
  }
  function embedSrc(p) {
    if (p.type === "youtube") return `https://www.youtube.com/embed/${p.id}?autoplay=1&mute=1&loop=1&playlist=${p.id}&playsinline=1&rel=0`;
    if (p.type === "tiktok") return `https://www.tiktok.com/player/v1/${p.id}?autoplay=1&loop=1&music_info=0&description=0`;
    if (p.type === "instagram") return `https://www.instagram.com/${p.kind}/${p.id}/embed/`;
  }

  /* ---------- API (ou démo) ---------- */
  const DEMO = !API_URL.trim();
  let demoData = [
    { id: "d1", logiciel: "Photoshop", lien: "https://www.youtube.com/shorts/1CvcYGXdg0s", titre: "", tags: [], auteur: "" },
  ];
  let password = "";
  try { password = sessionStorage.getItem("bo-pwd") || ""; } catch (e) {}

  async function api(action, extra = {}) {
    if (DEMO) {
      await new Promise(r => setTimeout(r, 150));
      if (action === "create") demoData.push({ id: "d" + Date.now(), ...extra.tuto });
      if (action === "update") demoData = demoData.map(t => t.id === extra.id ? { id: t.id, ...extra.tuto } : t);
      if (action === "delete") demoData = demoData.filter(t => t.id !== extra.id);
      if (action === "galerieAjout") {
        const ex = demoGal.find(g => norm(g.classe) === norm(extra.projet.classe) && norm(g.sujet) === norm(extra.projet.sujet) && norm(g.eleve) === norm(extra.projet.eleve));
        if (ex) { ex.image = extra.image.data; ex.ajoute_le = new Date().toISOString(); }
        else demoGal.push({ id: "g" + Date.now() + Math.random().toString(36).slice(2, 5), ...extra.projet, image: extra.image.data, ajoute_le: new Date().toISOString() });
      }
      if (action === "galerieModif") demoGal = demoGal.map(g => g.id === extra.id ? { ...g, ...extra.projet, image: extra.image ? extra.image.data : g.image } : g);
      if (action === "galerieSuppr") demoGal = demoGal.filter(g => g.id !== extra.id);
      if (action === "infos") return { ok: true, infos: await demoInfos(extra.lien) };
      if ((action === "create" || action === "update") && extra.tuto) extra.tuto.tags.forEach(tg => {
        if (!demoTags.some(x => norm(x) === norm(tg))) demoTags.push(tg);
      });
      if (action === "motDePasseEtudiant") {
        if (String(extra.cle || "").length < 4) return Promise.reject(new Error("Mot de passe étudiant : 4 caractères minimum"));
        demoCle = extra.cle;
      }
      return { ok: true, tutos: JSON.parse(JSON.stringify(demoData)), tags: demoTags.slice(), galerie: JSON.parse(JSON.stringify(demoGal)), accesEtudiants: !!demoCle };
    }
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, password, ...extra })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Erreur");
    return data;
  }

  // En mode démo : titre + auteur via noembed (les tags nécessitent l'Apps Script)
  async function demoInfos(lien) {
    const p = parseUrl(lien); if (!p || p.type !== "youtube") return {};
    const out = { id: p.id, cover: `https://i.ytimg.com/vi/${p.id}/hqdefault.jpg`, titre: "", auteur: "", tags: [] };
    try {
      const o = await (await fetch("https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + p.id))).json();
      out.titre = (o.title || "").replace(/#[\p{L}\p{N}_]+/gu, "").replace(/\s{2,}/g, " ").trim();
      out.auteur = o.author_name || "";
      out.tags = ((o.title || "").match(/#[\p{L}\p{N}_]+/gu) || []).map(s => s.slice(1)).filter(s => !/^shorts?$/i.test(s));
    } catch (e) {}
    return out;
  }

  let tutos = [];
  let galerie = [];
  let demoGal = [];
  let dbTags = [];                 // liste des tags enregistrée dans la base (onglet « Tags »)
  let demoTags = ["3D", "web", "print", "bitmap", "chrome"];
  let accesEtudiants = false;
  function setData(d) {
    tutos = d.tutos || []; if (d.tags) dbTags = d.tags;
    if (d.galerie) galerie = d.galerie;
    if (typeof d.accesEtudiants === "boolean") { accesEtudiants = d.accesEtudiants; renderAcces(); }
  }
  function renderAcces() {
    $("accesEtat").innerHTML = accesEtudiants
      ? `<b>Site ouvert</b> — les étudiants entrent avec le mot de passe étudiant. Pour le changer, tape-en un nouveau : l'ancien ne marchera plus.`
      : `<b class="ko">Site fermé</b> — choisis un mot de passe étudiant pour ouvrir l'accès aux tutos.`;
    $("cleBtn").textContent = accesEtudiants ? "Changer" : "Ouvrir le site";
  }
  let demoCle = "";
  let editing = null;
  let logiciel = LOGICIELS[0];
  let logicielChoisi = false;   // true si tu as cliqué toi-même sur un logiciel
  let cats = new Set();         // catégories cochées
  let catsChoisies = false;
  let apps = new Set();         // étapes de l'approche cochées
  let appsChoisies = false;
  const estApproche = c => APPROCHES.some(a => norm(a) === norm(c));

  function allCats() {
    const m = new Map(CATEGORIES.map(c => [norm(c), c]));
    tutos.forEach(t => (t.categories || []).forEach(c => { if (!estApproche(c) && !m.has(norm(c))) m.set(norm(c), c); }));
    cats.forEach(c => { if (!m.has(norm(c))) m.set(norm(c), c); });
    return [...m.values()];
  }
  function renderCats() {
    const on = new Set([...cats].map(norm));
    $("cats").innerHTML = allCats().map(c => `<button type="button" class="lab${on.has(norm(c)) ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("") +
      `<button type="button" class="lab new" id="newCat">+ Autre</button><input id="newCatInput" placeholder="Nom de la catégorie" hidden>`;
  }
  function renderApps() {
    const on = new Set([...apps].map(norm));
    $("apps").innerHTML = APPROCHES.map((c, i) => `<button type="button" class="lab${on.has(norm(c)) ? " on" : ""}" data-c="${esc(c)}"><span style="opacity:.5;margin-right:6px">0${i + 1}</span>${esc(c)}</button>`).join("");
  }
  $("apps").addEventListener("click", e => {
    const b = e.target.closest(".lab"); if (!b) return;
    const c = b.dataset.c, ex = [...apps].find(x => norm(x) === norm(c));
    ex ? apps.delete(ex) : apps.add(c);
    appsChoisies = true; renderApps();
  });
  $("cats").addEventListener("click", e => {
    const b = e.target.closest(".lab"); if (!b) return;
    if (b.id === "newCat") { b.hidden = true; const i = $("newCatInput"); i.hidden = false; i.focus(); return; }
    const c = b.dataset.c, k = norm(c);
    const ex = [...cats].find(x => norm(x) === k);
    ex ? cats.delete(ex) : cats.add(c);
    catsChoisies = true; renderCats();
  });
  const addNewCat = v => { v = v.trim(); if (v && !estApproche(v) && ![...cats].some(x => norm(x) === norm(v))) cats.add(v); catsChoisies = true; renderCats(); };
  $("cats").addEventListener("keydown", e => {
    if (e.target.id !== "newCatInput") return;
    if (e.key === "Enter") { e.preventDefault(); addNewCat(e.target.value); }
    if (e.key === "Escape") renderCats();
  });
  $("cats").addEventListener("focusout", e => { if (e.target.id === "newCatInput") setTimeout(() => addNewCat(e.target.value), 100); });

  // texte normalisé, sans les noms de logiciels (sinon « Photoshop » déclencherait « photo »)
  function sansLogiciels(s) {
    let h = " " + norm(s).replace(/[^a-z0-9'\- ]+/g, " ") + " ";
    allLogiciels().forEach(l => { h = h.split(norm(l)).join(" "); });
    return h.replace(/\s+/g, " ");
  }
  // mot-clé terminé par une espace ("app ") = mot entier ; sinon = début de mot
  const cle = m => " " + norm(m) + (m.endsWith(" ") ? " " : "");
  const trouve = (regles, hay) => Object.entries(regles).filter(([, mots]) => mots.some(m => hay.includes(cle(m)))).map(([c]) => c);
  function suggestCats(titre, tags) {
    // le logiciel aide aussi : InDesign → Print, Figma → Web
    const parLogiciel = { indesign: " print ", figma: " web ", blender: " 3d " }[norm(logiciel)] || "";
    return trouve(CATS_AUTO, " " + sansLogiciels([titre, ...tags].join(" ")) + " " + parLogiciel);
  }
  function suggestApps(titre, tags) {
    const found = trouve(APPS_AUTO, " " + sansLogiciels([titre, ...tags].join(" ")) + " ");
    const parLog = APPROCHE_PAR_LOGICIEL[norm(logiciel)];
    if (parLog && !found.includes(parLog)) found.push(parLog);
    return APPROCHES.filter(c => found.includes(c));   // dans l'ordre du cycle
  }


  /* =====================================================================
     GALERIE DES PROJETS — 1 image par élève et par sujet
     ===================================================================== */
  const CLASSES = ["Prépa 1", "Prépa 2", "G2", "G3"];
  const gsrc = (id, w) => /^(data:|blob:|https?:)/.test(id) ? id : `https://lh3.googleusercontent.com/d/${id}=w${w}`;
  window.gImgErr = img => { if (!img.dataset.r && img.dataset.id) { img.dataset.r = 1; img.src = `https://drive.google.com/thumbnail?id=${img.dataset.id}&sz=w400`; } };
  let gClasse = "", gQueue = [], gEdit = null, gBusy = false;

  // « léa martin », « lea-martin.jpg » ou « Léa M. » → « Léa M. »
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  function formatNom(v, fichier) {
    if (/^[\p{L}'-]+ \p{Lu}\.$/u.test(String(v || "").trim())) return String(v).trim();   // déjà au format « Prénom N. »
    let s = String(v || "").replace(/\.[a-z0-9]{2,4}$/i, "").replace(fichier ? /[_\-.]+/g : /[_.]+/g, " ").replace(/\d+/g, " ").replace(/\s+/g, " ").trim();
    if (!s || /^(img|dsc|dscn|pxl|photo|image|scan|screenshot|capture|sans titre|untitled|fichier)\b/i.test(s)) return "";
    const w = s.split(" ").filter(Boolean);
    if (w.length === 1) return cap(w[0]);
    return w[0].split("-").map(cap).join("-") + " " + w[w.length - 1].charAt(0).toUpperCase() + ".";
  }
  /* Nom de fichier → classe, sujet, élève
     « CLASSE_SUJET_Prénom_Nom.jpg »  ex. G3_DUC_Zoé_Pureur.jpg → G3 · DUC · Zoé P.
     L'élève peut aussi être collé : G3_DUC_ZoéPureur.jpg
     Sans classe dans le nom : c'est la classe choisie en haut qui s'applique.
     Sans « _ » : seulement l'élève (« lea-martin.jpg » → Lea M.) */
  // PREPA, PREPAS, PREPA1, Prépa 2… → Prépas ; G2 ; G3
  const classeDe = x => {
    const k = norm(x).replace(/[\s._-]+/g, "");
    const m = k.match(/^prep(?:a|as)?(\d)$/);
    if (m) return "Prépa " + m[1];                 // PREPA1, Prépa 2, prep2… → Prépa 1 / Prépa 2
    return k === "g2" ? "G2" : k === "g3" ? "G3" : "";
  };
  const isUpper = w => w === w.toUpperCase() && w !== w.toLowerCase();
  function eleveDe(tokens) {
    let t = tokens.flatMap(x => x.split(/\s+/)).filter(Boolean);
    if (t.length === 1 && !t[0].includes("-")) t = t[0].split(/(?<=\p{Ll})(?=\p{Lu})/u);   // ZoéPureur → Zoé Pureur
    if (!t.length || !t.every(x => /\p{L}/u.test(x))) return "";
    if (t.length === 1) return cap(t[0]);
    let prenom = t[0], nom = t[t.length - 1];
    if (isUpper(prenom) && !isUpper(nom)) [prenom, nom] = [nom, prenom];     // NOM_Prénom accepté aussi
    return prenom.split("-").map(cap).join("-") + " " + nom.charAt(0).toUpperCase() + ".";
  }
  function parseFichier(fname) {
    const base = String(fname || "").replace(/\.[a-z0-9]{2,4}$/i, "").normalize("NFC").trim();
    if (!base.includes("_")) return { nom: formatNom(base, true), sujet: "", classe: "" };
    let parts = base.split("_").map(x => x.trim()).filter(Boolean), classe = "";
    parts = parts.filter(x => { const c = classeDe(x); if (c && !classe) { classe = c; return false; } return true; });
    // photos d'appareil (IMG_2034, DSC_0012…) : rien à deviner
    if (!parts.length || /^(img|dsc|dscn|pxl|photo|image|scan|screenshot|capture|whatsapp)$/i.test(parts[0]) || !/\p{L}/u.test(parts[0]))
      return { nom: "", sujet: "", classe };
    if (parts.length === 1) return { nom: "", sujet: "", classe };
    // les 2 derniers morceaux = Prénom_Nom ; tout ce qui précède = le sujet
    // (avec seulement 2 morceaux : SUJET_PrénomNom collés)
    const nEleve = parts.length >= 3 ? 2 : 1;
    let sujet = parts.slice(0, -nEleve).join(" ").replace(/-+/g, " ").replace(/\s+/g, " ").trim();
    // « AFFICHE EFFETS » → « Affiche effets » (un sigle court comme « DUC » reste en capitales)
    if (isUpper(sujet) && (sujet.includes(" ") || sujet.length > 4)) sujet = sujet.toLowerCase();
    const connu = sujetsDe("").find(x => norm(x) === norm(sujet));            // garde l'orthographe d'un sujet existant
    sujet = connu || sujet.charAt(0).toUpperCase() + sujet.slice(1);
    return { nom: eleveDe(parts.slice(-nEleve)), sujet, classe };
  }
  const sujetsDe = c => [...new Map(galerie.filter(g => !c || norm(g.classe) === norm(c)).map(g => [norm(g.sujet), g.sujet])).values()];
  const existe = (c, s, e) => galerie.find(g => norm(g.classe) === norm(c) && norm(g.sujet) === norm(s) && norm(g.eleve) === norm(e) && (!gEdit || g.id !== gEdit));

  /* Compression avant l'envoi : 2000 px de côté maximum, JPG qualité 0,82
     (léger pour le site ; la galerie affiche au plus 2000 px). Les PNG restent
     en PNG s'ils sont transparents. Les PDF sont convertis en JPG (1re page). */
  const MAXPX = 2000, QUAL = .82;
  const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/";
  let pdfLib = null;
  async function pdfjs() {
    if (!pdfLib) {
      pdfLib = await import(PDFJS + "pdf.min.mjs");
      pdfLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
    }
    return pdfLib;
  }
  function toJpeg(src, w, h) {
    const k = Math.min(1, MAXPX / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  async function pdfEnImage(file) {
    const lib = await pdfjs().catch(() => { throw new Error("Lecteur PDF indisponible (connexion ?)"); });
    const task = lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) });
    const doc = await task.promise;
    const page = await doc.getPage(1);
    const v1 = page.getViewport({ scale: 1 });
    const scale = Math.min(4, MAXPX / Math.max(v1.width, v1.height));
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({ canvas: c, canvasContext: g, viewport: vp }).promise;
    try { await task.destroy(); } catch (e) {}
    return { data: c.toDataURL("image/jpeg", QUAL), mime: "image/jpeg" };
  }
  function prepare(file) {
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) return pdfEnImage(file);
    return new Promise((ok, ko) => {
      if (file.type === "image/gif") { const r = new FileReader(); r.onload = () => ok({ data: r.result, mime: file.type }); r.onerror = ko; r.readAsDataURL(file); return; }
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let mime = "image/jpeg";
        if (file.type === "image/png") {            // PNG transparent : on garde le PNG
          const t = document.createElement("canvas"); t.width = Math.min(64, img.naturalWidth); t.height = Math.min(64, img.naturalHeight);
          const tg = t.getContext("2d"); tg.drawImage(img, 0, 0, t.width, t.height);
          const px = tg.getImageData(0, 0, t.width, t.height).data;
          for (let i = 3; i < px.length; i += 4) if (px[i] < 250) { mime = "image/png"; break; }
        }
        const k = Math.min(1, MAXPX / Math.max(img.naturalWidth, img.naturalHeight));
        let c;
        if (mime === "image/png") {
          c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        } else c = toJpeg(img, img.naturalWidth, img.naturalHeight);
        ok({ data: c.toDataURL(mime, QUAL), mime });
      };
      img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("Image illisible")); };
      img.src = url;
    });
  }

  function renderGal() {
    $("gClasse").innerHTML = CLASSES.map(c => `<button type="button" class="lab${c === gClasse ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    const cur = norm($("gSujet").value);
    $("gSujets").innerHTML = sujetsDe(gClasse).filter(x => norm(x) !== cur).map(x => `<button type="button" data-s="${esc(x)}">+ ${esc(x)}</button>`).join("");
    renderQueue(); renderGList();
  }
  function renderQueue() {
    const defS = $("gSujet").value.trim();
    $("gQueue").innerHTML = gQueue.map((q, i) => {
      const c = q.classe || gClasse, s = q.sujet || defS;
      const dup = c && s && q.nom && existe(c, s, q.nom);
      const st = q.st || (dup ? "Remplacera l'image en ligne" : "");
      const cls = q.cls || (dup ? "warn" : "");
      return `<div class="qi" data-i="${i}">
        <div class="th">${q.url ? `<img src="${q.url}" alt="">` : `<span class="pdfph">PDF</span>`}</div>
        ${q.done ? "" : `<button type="button" class="rm" title="Retirer" aria-label="Retirer">✕</button>`}
        <input type="text" data-f="nom" value="${esc(q.nom)}" placeholder="Prénom Nom" aria-label="Nom de l'élève" ${q.done || gBusy ? "disabled" : ""}>
        ${gEdit ? "" : `<input type="text" data-f="sujet" class="qs" value="${esc(q.sujet || "")}" placeholder="${esc(defS || "Sujet")}" aria-label="Sujet" ${q.done || gBusy ? "disabled" : ""}>
        <span class="qc">${esc(c || "Classe ?")}${q.classe ? "" : (gClasse ? "" : "")}</span>`}
        <span class="st ${cls}">${esc(st)}</span></div>`;
    }).join("");
    $("gEleveField").hidden = !gEdit;
    $("gDrop").hidden = false;
    $("gDropT").textContent = gEdit ? "Remplacer l'image (facultatif) : glisse-la ici ou clique" : "Glisse les images ici, ou clique pour les choisir";
    $("gDropS").hidden = !!gEdit;
    updSend();
  }
  function updSend() {
    const todo = gQueue.filter(q => !q.done);
    const okBase = gClasse && $("gSujet").value.trim();
    if (gEdit) {
      $("gSend").disabled = gBusy || !okBase || !$("gEleve").value.trim();
      $("gSend").textContent = gBusy ? "Enregistrement…" : "Enregistrer";
      return;
    }
    const defS = $("gSujet").value.trim();
    const sansClasse = todo.some(q => !(q.classe || gClasse)), sansSujet = todo.some(q => !(q.sujet || defS));
    $("gSend").disabled = gBusy || !todo.length || sansClasse || sansSujet;
    $("gSend").textContent = gBusy ? $("gSend").textContent
      : !todo.length ? (!gClasse ? "Choisis une classe" : !defS ? "Indique le sujet" : "Ajoute des images")
      : sansClasse ? "Choisis une classe" : sansSujet ? "Indique le sujet"
      : `Envoyer ${todo.length} projet${todo.length > 1 ? "s" : ""}`;
  }
  function addFiles(files) {
    const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    const imgs = [...files].filter(f => /^image\/(jpeg|png|webp|gif)$/.test(f.type) || isPdf(f));
    if (!imgs.length) return toast("Formats acceptés : JPG, PNG, WebP, GIF ou PDF", true);
    // aperçu des PDF : converti tout de suite (et réutilisé à l'envoi)
    const apercu = q => { if (!isPdf(q.file)) return; q.url = ""; q.st = "Conversion du PDF…";

  // Tags : hashtags du titre + mots-clés reconnus (TAGS_AUTO) + tags déjà utilisés présents dans le titre
  function suggestTags(titre, hashtags) {
    const hay = sansLogiciels(titre);
    const out = [];
    const add = s => { if (s && !out.some(x => norm(x) === norm(s))) out.push(s); };
    hashtags.forEach(h => { const k = Object.keys(TAGS_AUTO).find(tag => norm(tag) === norm(h)); add(k || h); });
    Object.entries(TAGS_AUTO).forEach(([tag, mots]) => { if (mots.some(m => hay.includes(" " + norm(m)))) add(tag); });
    allTags().forEach(t => { if (norm(t.label).length > 2 && hay.includes(" " + norm(t.label) + " ")) add(t.label); });
    return out.filter(s => !allLogiciels().some(l => norm(l) === norm(s))).slice(0, 6);
  }

  async function fetchInfos(lien, id) {
    const h = $("lienHelp");
    h.textContent = "YouTube ✓ — récupération du titre, de l'auteur et des tags…"; h.className = "help ok";
    let inf = {};
    try { inf = (await api("infos", { lien })).infos || {}; } catch (e) {}
    const hashtags = (inf.tags || []).slice();
    // titre d'origine (avec le nom du logiciel) + titre court traduit, pour les suggestions
    const titreTout = [inf.titreOriginal || "", inf.titre || ""].join(" ");
    if (lastInfos !== id) return;               // un autre lien a été collé entre-temps
    const fill = (fid, val) => { const el = $(fid); if (val && !el.value.trim()) { el.value = val; el.classList.remove("fetched"); void el.offsetWidth; el.classList.add("fetched"); } };
    fill("fTitre", inf.titre);
    fill("fAuteur", inf.auteur);
    if (!$("fTags").value.trim()) {
      const tags = suggestTags(titreTout, inf.tags || []);
      if (tags.length) { inf.tags = tags; fill("fTags", tags.join(", ")); }
    }
    if (!catsChoisies && !cats.size && !editing) {
      suggestCats(titreTout, inf.tags || []).forEach(c => cats.add(c));
      renderCats();
    }
    if (!appsChoisies && !apps.size && !editing) {
      suggestApps(titreTout, inf.tags || []).forEach(c => apps.add(c));
      renderApps();
    }
    // Logiciel détecté dans le titre ou les tags
    const hay = norm([titreTout, ...hashtags].join(" "));
    const found = allLogiciels().find(l => hay.includes(norm(l)));
    if (found && !editing && !logicielChoisi) { logiciel = found; renderLabels(); }
    renderSugg(); setPreview(parseUrl(lien), inf.titre);
    const got = [inf.titre && "titre", inf.auteur && "auteur", inf.tags && inf.tags.length && "tags"].filter(Boolean);
    h.textContent = "YouTube ✓" + (got.length ? " — " + got.join(", ") + " récupérés"
      : DEMO ? " — récupération auto active une fois le back office branché et en ligne"
      : " — infos non disponibles, remplis à la main");
  }

    try {
      setData(await api("motDePasseEtudiant", { cle }));
      $("cleEtu").value = "";
      toast(accesEtudiants ? "Mot de passe étudiant enregistré" : "Enregistré");
    } catch (err) { toast(err.message, true); }
    $("cleBtn").disabled = false;
  }
  $("cleBtn").addEventListener("click", saveCle);
  $("cleEtu").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveCle(); } });

  let tt;
  function toast(msg, err) {
    const el = $("toast"); el.textContent = msg; el.className = "toast show" + (err ? " err" : "");
    clearTimeout(tt); tt = setTimeout(() => el.className = "toast", 2200);
  }
})();
</script>
</body>
</html>
